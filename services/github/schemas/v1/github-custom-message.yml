$schema: "/schemas/common/metaschema.json#"
title:        "GitHub Custom Message"
description: |
  Custom message published from .taskcluster.yml messages field
type:         object
properties:
  version:    {$const: message-version}
  organization:
    description: |
      The GitHub `organization` which had an event.
    type:         string
    minLength:    {$const: github-identifier-min-length}
    maxLength:    {$const: github-identifier-max-length}
    pattern:      {$const: github-identifier-pattern}
  repository:
    description: |
      The GitHub `repository` which had an event.
    type:         string
    minLength:    {$const: github-identifier-min-length}
    maxLength:    {$const: github-identifier-max-length}
    pattern:      {$const: github-identifier-pattern}
  topic:
    description: |
      User-defined topic from .taskcluster.yml messages field.
    type:         string
    maxLength:    80
  installationId:
    description: |
       The installation which had an event.
    type:          integer
    minimum:    {$const: github-installation-minimum}
    maximum:    {$const: github-installation-maximum}
  eventId:
    type: string
    description: |
      The GitHub webhook deliveryId. Extracted from the header 'X-GitHub-Delivery'
    pattern: {$const: github-guid-pattern}
  tasks_for:
    type: string
    description: |
      The type of the event (e.g., github-push, github-pull-request)
  taskGroupId:
    type: string
    description: |
      The task group ID associated with this GitHub event. This ID is always generated
      and available, regardless of whether .taskcluster.yml defines tasks. Hooks can use
      this to create tasks that report to the same GitHub check suite by adding
      "taskGroupId": "${payload.taskGroupId}" to their task definitions.
    pattern: {$const: slugid-pattern}
  event:
    type: object
    description: |
      The raw GitHub webhook event body
    additionalProperties: true
  context:
    type: object
    description: |
      User-defined message context from .taskcluster.yml
    additionalProperties: true
additionalProperties: false
required:
  - version
  - organization
  - repository
  - topic
  - installationId
  - eventId
  - tasks_for
  - taskGroupId
  - event
  - context
